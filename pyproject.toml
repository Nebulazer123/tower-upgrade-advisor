[project]
name = "tower-upgrade-advisor"
version = "0.1.0"
description = "Recommends the best next permanent upgrade in The Tower (idle tower defense)"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "pydantic>=2.13.4,<3",
    "jinja2>=3.1.6,<4",
    "gunicorn>=26.0.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0,<10",
    "pytest-cov>=7.1.0,<8",
    "mypy>=2.1.0,<3",
    "ruff>=0.15.17,<0.16",
]
extract = [
    "playwright>=1.60.0,<2",
    "httpx>=0.28.1,<1",
]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests",
]
addopts = "-x -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
